# Configuración de Nginx para SIAONDA Frontend
# =============================================

server {
    # Escucha en el puerto 80 (HTTP)
    listen 80;

    # Nombre del servidor (puede ser localhost o tu dominio)
    server_name localhost;

    # Directorio raíz donde están los archivos estáticos del build
    root /usr/share/nginx/html;

    # Archivo por defecto al acceder a /
    index index.html;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Límite de tamaño de archivos subidos (1GB)
    client_max_body_size 1024M;

    # Compresión gzip para mejorar velocidad de carga
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ==========================================
    # INDEX.HTML - NO CACHEAR
    # ==========================================
    # El index.html nunca debe cachearse para que siempre cargue la versión más reciente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        etag off;
    }

    # ==========================================
    # REGLA PRINCIPAL: Single Page Application
    # ==========================================
    # Intenta servir el archivo solicitado, si no existe, sirve index.html
    # Esto permite que React Router maneje las rutas del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ==========================================
    # PROXY AL BACKEND (API)
    # ==========================================
    # Redirige todas las peticiones /api/* al backend
    location /api/ {
        # Límite de tamaño para uploads (debe estar aquí también)
        client_max_body_size 1024M;

        # Proxy al contenedor del backend (nombre del servicio en docker-compose)
        proxy_pass http://backend:3000;

        # Headers necesarios para el proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para peticiones largas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Deshabilita caché del proxy para la API
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================
    # UPLOADS (Archivos subidos por usuarios)
    # ==========================================
    # IMPORTANTE: El modificador ^~ hace que esta regla tenga prioridad
    # sobre las expresiones regulares (como la regla de archivos estáticos)
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Headers de caché para uploads
        expires 7d;
        add_header Cache-Control "public";
    }

    # ==========================================
    # ARCHIVOS ESTÁTICOS (CSS, JS, imágenes del build)
    # ==========================================
    # Cachea archivos estáticos por 1 año (tienen hash en el nombre)
    # NOTA: Los archivos de /uploads/ ya fueron manejados arriba
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # SALUD DEL SERVIDOR
    # ==========================================
    # Endpoint para health checks
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # MANEJO DE ERRORES
    # ==========================================
    # Página personalizada de error 404
    error_page 404 /index.html;

    # Página de error 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
